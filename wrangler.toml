name = "gymtime"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Sito: i file in public/ vengono serviti direttamente, /api/* passa al Worker
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "gymtime"
database_id = "d7ae0716-6899-4722-bbf5-58465e7ed77d"
migrations_dir = "migrations"

# Workers AI: lettura di PDF, Word, Excel e foto, trascrizione della voce, conversione in scheda
[ai]
binding = "AI"

# Limite tentativi su login e cambio password: 10 al minuto
[[ratelimits]]
name = "LIMITE_ACCESSI"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[observability]
enabled = true
